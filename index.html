<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Invaders</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="hud">
      <span>SCORE <b id="score">0</b></span>
      <span>LEVEL <b id="level">1</b></span>
      <span>LIVES <b id="lives">3</b></span>
    </header>
    <canvas id="game" width="600" height="600"></canvas>
    <p class="help">Arrow keys / A D to move &middot; Space to shoot &middot; P to pause</p>
    <div id="overlay" class="overlay">
      <h1 id="title">SPACE INVADERS</h1>
      <p id="message">Press Enter to start</p>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
